name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14            # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swiftc --version && xcodebuild -version

      - name: Build universal (arm64 + x86_64)
        run: |
          ./build.sh
          cd build && zip -r wCopyTool-universal.zip wCopyTool.app
          shasum -a 256 wCopyTool-universal.zip

      - name: Build Mojave x86_64 (10.14, guaranteed Intel/Mojave)
        run: |
          MOJAVE_ONLY=1 ./build.sh
          cd build && zip -r wCopyTool-mojave-x86_64.zip wCopyTool.app
          shasum -a 256 wCopyTool-mojave-x86_64.zip

      - name: Upload universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: wCopyTool-universal
          path: build/wCopyTool-universal.zip
          if-no-files-found: error

      - name: Upload Mojave artifact
        uses: actions/upload-artifact@v4
        with:
          name: wCopyTool-mojave-x86_64
          path: build/wCopyTool-mojave-x86_64.zip
          if-no-files-found: error

      - name: Attach to Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/wCopyTool-universal.zip
            build/wCopyTool-mojave-x86_64.zip
