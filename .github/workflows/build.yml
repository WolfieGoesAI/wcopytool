name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write                # allow the rolling-release publish below

jobs:
  macos:
    runs-on: macos-15            # current GA image (macos-13 closing down, macos-14 retired Oct 2026);
                                 # Apple Silicon host builds the universal arm64+x86_64 binary natively
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swiftc --version && xcodebuild -version

      - name: Build universal (arm64 + x86_64)
        run: |
          mkdir -p dist
          set +e
          ./build.sh 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" != "0" ]; then
            { echo '### Build failed'; echo '```'; grep -E "error:|warning:" build.log | head -60; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit "$rc"
          fi
          ( cd build && zip -r ../dist/wCopyTool-universal.zip wCopyTool.app )
          shasum -a 256 dist/wCopyTool-universal.zip

      - name: Build Mojave x86_64 (10.14, guaranteed Intel/Mojave)
        run: |
          mkdir -p dist
          MOJAVE_ONLY=1 ./build.sh
          ( cd build && zip -r ../dist/wCopyTool-mojave-x86_64.zip wCopyTool.app )
          shasum -a 256 dist/wCopyTool-mojave-x86_64.zip

      - name: Upload universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: wCopyTool-universal
          path: dist/wCopyTool-universal.zip
          if-no-files-found: error

      - name: Upload Mojave artifact
        uses: actions/upload-artifact@v4
        with:
          name: wCopyTool-mojave-x86_64
          path: dist/wCopyTool-mojave-x86_64.zip
          if-no-files-found: error

      - name: Attach to Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/wCopyTool-universal.zip
            dist/wCopyTool-mojave-x86_64.zip

      - name: Publish rolling 'latest' release (on main)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Auto-built from the latest commit on main. Download a .zip below.
          files: |
            dist/wCopyTool-universal.zip
            dist/wCopyTool-mojave-x86_64.zip
