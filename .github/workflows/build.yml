name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14            # Apple Silicon runner → builds a universal binary
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swiftc --version && xcodebuild -version

      - name: Build universal wCopyTool.app
        run: ./build.sh

      - name: Zip app
        run: |
          cd build
          zip -r wCopyTool-macos.zip wCopyTool.app
          shasum -a 256 wCopyTool-macos.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wCopyTool-macos
          path: build/wCopyTool-macos.zip
          if-no-files-found: error

      - name: Attach to Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/wCopyTool-macos.zip
